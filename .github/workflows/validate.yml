name: Validate CloudFormation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: pip install cfn-lint checkov
      - name: cfn-lint (schema, intrinsic functions, best practices)
        run: cfn-lint "*/template.yaml"
      - name: Checkov (security policy scan)
        run: checkov -d . --framework cloudformation --compact --quiet
