AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Solution 02 - Secure static website. Private Amazon S3 origin reachable only through Amazon
  CloudFront Origin Access Control (OAC), security response headers, a CloudFront Function for
  clean URLs, access logging, optional custom domain (ACM + Route 53) and optional AWS WAF.
  A Lambda-backed custom resource seeds sample content and empties the bucket on stack deletion.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Optional custom domain }
        Parameters: [DomainName, AcmCertificateArn, HostedZoneId]
      - Label: { default: Optional protection and delivery }
        Parameters: [WebAclArn, PriceClass]

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain (e.g. www.example.com). Requires AcmCertificateArn.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: ARN of an ACM certificate in us-east-1 covering DomainName (required by CloudFront).
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 public hosted zone ID - creates A/AAAA alias records for DomainName.
  WebAclArn:
    Type: String
    Default: ""
    Description: Optional AWS WAF web ACL ARN with CLOUDFRONT scope (must be created in us-east-1).
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref AcmCertificateArn, ""]]
  CreateDnsRecords: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  LogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "This is the log destination bucket itself."
          - id: CKV_AWS_21
            comment: "Log objects are write-once and expire after 90 days; versioning adds cost without benefit."
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # CloudFront standard logging (legacy) writes with ACLs, so ACLs must be enabled on this bucket only.
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerPreferred }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: 90
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt LogsBucket.Arn, !Sub "${LogsBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal: { Service: logging.s3.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${LogsBucket.Arn}/s3-access/*"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
              ArnLike: { "aws:SourceArn": !GetAtt SiteBucket.Arn }

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: s3-access/
      LifecycleConfiguration:
        Rules:
          - Id: tidy-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: AllowCloudFrontOacList # lets S3 return 404 (not 403) for missing objects
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------------------------------------------------------------------------
  # CloudFront
  # ---------------------------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: SigV4-signed access from CloudFront to the private site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map /path and /path/ to /path/index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: OWASP-recommended security headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), payment=()"
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_174
            comment: "TLSv1.2_2021 is enforced when a custom certificate is supplied; the default *.cloudfront.net certificate does not allow setting a minimum protocol."
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} static website"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: SiteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
        Logging:
          Bucket: !GetAtt LogsBucket.DomainName
          Prefix: cloudfront/
          IncludeCookies: false

  DnsRecordIpv4:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # fixed hosted zone ID for all CloudFront distributions

  DnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---------------------------------------------------------------------------
  # Content seeding / bucket cleanup custom resource
  # ---------------------------------------------------------------------------
  ContentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: "CloudWatch Logs encrypts log data at rest by default; a CMK is optional and would need a log-service key policy."
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-site-content"
      RetentionInDays: 14

  ContentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: site-content
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ContentFunctionLogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: !Sub "${SiteBucket.Arn}/*"

  ContentFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: "Deliberately not VPC-attached: the function only calls AWS APIs over TLS with IAM auth; a VPC would add NAT/endpoint cost and cold-start latency with no security gain."
          - id: CKV_AWS_115
            comment: "No reserved concurrency: new accounts may have a 10-concurrency quota, and reserving it can fail deployment. Throttling is enforced upstream (API Gateway/EventBridge)."
          - id: CKV_AWS_116
            comment: "Function is invoked synchronously (API Gateway, Step Functions or CloudFormation); a Lambda DLQ only applies to asynchronous invocations."
          - id: CKV_AWS_173
            comment: "Environment variables hold only resource names/ARNs (no secrets) and are encrypted at rest with the AWS managed key."
    Properties:
      FunctionName: !Sub "${AWS::StackName}-site-content"
      Description: Seeds sample pages on create/update and empties the bucket on delete
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt ContentFunctionRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ContentFunctionLogGroup
      Code:
        ZipFile: |
          import logging
          import boto3
          import cfnresponse

          s3 = boto3.client("s3")
          STYLE = "body{font-family:system-ui,sans-serif;max-width:42rem;margin:4rem auto;padding:0 1rem;line-height:1.6;color:#232f3e}code{background:#f2f3f3;padding:.1rem .3rem}"
          PAGES = {
              "index.html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>It works</title><style>" + STYLE + "</style></head><body><h1>Static site on S3 + CloudFront</h1><p>This page is served from a <strong>private</strong> S3 bucket through CloudFront Origin Access Control, with security headers applied at the edge.</p><p>Replace this content with <code>aws s3 sync ./site s3://&lt;bucket&gt;</code> and create an invalidation.</p><p><a href='/docs/'>Clean URL example</a></p></body></html>",
              "docs/index.html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><title>Docs</title><style>" + STYLE + "</style></head><body><h1>/docs/</h1><p>Served from <code>docs/index.html</code> by the CloudFront Function URL rewrite.</p><p><a href='/'>Home</a></p></body></html>",
              "404.html": "<!doctype html><html lang='en'><head><meta charset='utf-8'><title>Not found</title><style>" + STYLE + "</style></head><body><h1>404 - Page not found</h1><p><a href='/'>Home</a></p></body></html>",
          }

          def empty_bucket(bucket):
              for page in s3.get_paginator("list_object_versions").paginate(Bucket=bucket):
                  objs = [{"Key": o["Key"], "VersionId": o["VersionId"]}
                          for o in page.get("Versions", []) + page.get("DeleteMarkers", [])]
                  for i in range(0, len(objs), 1000):
                      s3.delete_objects(Bucket=bucket, Delete={"Objects": objs[i:i + 1000], "Quiet": True})

          def handler(event, context):
              status = cfnresponse.SUCCESS
              try:
                  bucket = event["ResourceProperties"]["BucketName"]
                  if event["RequestType"] in ("Create", "Update"):
                      for key, body in PAGES.items():
                          s3.put_object(Bucket=bucket, Key=key, Body=body.encode("utf-8"),
                                        ContentType="text/html; charset=utf-8", CacheControl="public, max-age=300")
                  elif event["RequestType"] == "Delete":
                      empty_bucket(bucket)
              except Exception:
                  logging.exception("Custom resource failed")
                  # Never block stack deletion; fail loudly on create/update.
                  if event["RequestType"] != "Delete":
                      status = cfnresponse.FAILED
              cfnresponse.send(event, context, status, {}, "site-content")

  SiteContent:
    Type: Custom::SiteContent
    DependsOn: SiteBucketPolicy
    Properties:
      ServiceToken: !GetAtt ContentFunction.Arn
      ServiceTimeout: 300
      BucketName: !Ref SiteBucket
      ContentVersion: "1"

Outputs:
  WebsiteUrl:
    Description: CloudFront URL of the website
    Value: !If
      - HasCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  LogsBucketName:
    Value: !Ref LogsBucket
